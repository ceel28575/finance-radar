</style><aside><div class="eyebrow">◉ FINANCE RADAR</div><h2>财经雷达</h2><small>资讯 → 证据 → 研判</small><nav id="nav"></nav><small>北京时间 · 按日归档<br>盘中 1 分钟 / 盘后 30 分钟<br>午休暂停</small></aside><main><header><div><div class="eyebrow">RESEARCH WORKSPACE / 研究工作台</div><h1 id="title">市场总览</h1><small id="clock"></small></div><div class="row"><label>分析日期 <input type="date" id="day"></label><button id="import">导入数据</button><button id="export">导出当日</button></div></header><div class="notice">数据接入待完成 · 当前展示你导入的本机数据。实时 MX 采集与 AI 服务尚未连接，不会生成虚构行情或概率。</div><div id="view"></div><footer>财经雷达 · GitHub 版本 0.3　｜　AI 概率为模型判断，不代表实际胜率　｜　资讯与报告云端保存，个人笔记等本机保存。</footer></main><input type="file" id="file" accept=".json,application/json" hidden><dialog id="modal"><div class="row"><h2 id="modalTitle">详情</h2><button onclick="document.querySelector('dialog').close()">关闭</button></div><div id="modalBody"></div></dialog><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let data={items:[],reports:[]};try{data=JSON.parse(localStorage.getItem('radar-v1'))||data}catch{};let page='市场总览',query='',direction='全部',favorite=false;let stars;try{stars=JSON.parse(localStorage.getItem('radar-stars'))||[]}catch{stars=[]}

function render(){ $('#title').textContent=page;$('#nav').innerHTML=['市场总览','每日股票池','资讯研究','历史报告','采集与设置'].map((x,i)=>'<button data-page="'+x+'" class="'+(page===x?'active':'')+'">0'+(i+1)+'　'+x+'</button>').join('');let r=report(),it=items(),html='';
if(page==='市场总览'){html='<div class="grid four">'+card('当日有效资讯',it.length,'按原文北京时间归档')+card('已保存研判',reports().length,'保留每轮分析结果')+card('看多 / 看空',(r?.stocks||[]).filter(x=>x.direction==='bull').length+' / '+(r?.stocks||[]).filter(x=>x.direction==='bear').length,'当日股票池')+card('有效来源',new Set(it.map(x=>x.source)).size,'去重后的来源数')+'</div><div class="grid"><section class="card"><div class="row"><h2>指数方向</h2><span class="badge">AI 研判</span></div>'+(r?.bull_probability!=null?'<div class="metric red">'+esc(r.bull_probability)+'% <small>看多</small></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,r.bull_probability))+'%"></i></div><p class="green">看空 '+(100-r.bull_probability)+'%</p><p>'+esc(r.index_reason)+'</p>':empty('待接入有效数据<br>暂不估计多空概率'))+'</section><section class="card"><h2>盘面主线</h2><p>'+esc(r?.summary||'暂无当日盘面分析。导入已有报告后，将显示资金方向、主导板块与市场分歧。')+'</p><small>报告时间：'+esc(r?.generated_at||'—')+'</small></section><section class="card"><h2>风险与观察</h2><p>'+esc(r?.risk||'暂无有依据的风险研判')+'</p><small>关注证据变化与观点失效条件，避免仅根据单条消息形成判断。</small></section></div><div class="grid two">'+stockList('bull')+stockList('bear')+'</div>'}
if(page==='每日股票池'){html='<div class="tabs"><input id="search" type="search" placeholder="搜索公司、行业或理由" value="'+esc(query)+'"><button id="favorites" class="'+(favorite?'active':'')+'">★ 仅看自选</button></div><small>股票池按分析日期保存。收藏保存在当前浏览器，刷新不丢失。</small><div class="grid two">'+stockList('bull')+stockList('bear')+'</div>'}
if(page==='资讯研究'){html='<div class="tabs"><input id="search" type="search" placeholder="搜索正文、作者、来源" value="'+esc(query)+'"></div><div class="card"><h2>当日资讯档案</h2>'+ (it.filter(x=>[x.content,x.source,x.author].join(' ').includes(query)).sort((a,b)=>String(b.published_at).localeCompare(String(a.published_at))).map(x=>'<article class="stock"><div class="row"><span class="badge">'+esc(x.source)+'</span><small>'+esc(x.published_at)+'</small></div><h3>'+esc(x.title||'资讯正文')+'</h3><p>'+esc(x.content)+'</p><small>作者 '+esc(x.author||'未标注')+' · ID '+esc(x.id)+' · '+esc(x.kind||'来源内容，尚未独立核实')+'</small></article>').join('')||empty('暂无匹配资讯'))+'</div>'}
if(page==='历史报告'){html='<div class="card"><h2>当日研判时间线</h2><small>切换右上角日期查看历史。导入时保留不同时间的报告。</small>'+(reports().map(r=>'<details class="stock"><summary>'+esc(r.generated_at)+'　'+esc(r.title||'市场研判')+'</summary><p>'+esc(r.summary)+'</p><p>风险：'+esc(r.risk)+'</p><p>股票池 '+(r.stocks||[]).length+' 只</p></details>').join('')||empty('该日暂无报告'))+'</div>'}
if(page==='采集与设置'){html='<div class="grid two"><div class="card"><h2>数据链路</h2><table><tr><td>MX 网页采集</td><td class="amber">未连接</td></tr><tr><td>图片 OCR</td><td class="amber">待接入</td></tr><tr><td>AI 分析服务</td><td class="amber">本机千问 + 云端豆包；启动采集器后运行</td></tr><tr><td>云端持久化</td><td class="green">私有云端数据库已配置</td></tr><tr><td>JSON 导入 / 导出</td><td class="green">可用 · 本机保存</td></tr></table></div><div class="card"><h2>整理规则</h2><p>盘中每 1 分钟，盘后每 30 分钟；午休跳过。</p><p>按北京时间原文日期归档，跨日新建股票池。</p><p>屏蔽：奇幻团课 / 微信 qmxp2077。</p><small>以上为目标调度规则，采集器启动后由本机千问预处理、云端豆包生成研判；API Key 仅在本机进程内存中使用。</small></div></div><div class="card"><h2>导入已有资料</h2><p>支持资讯与分析报告 JSON。相同 ID 的资讯合并；同日期、同生成时间的报告更新。单文件上限 5 MB。</p><button id="schema">查看导入格式</button><p><a href="https://github.com/ceel28575/finance-radar" target="_blank" rel="noopener">查看 GitHub 源码 ↗</a></p></div>'}
$('#view').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;query='';render()});document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{let n=b.dataset.star;stars=stars.includes(n)?stars.filter(x=>x!==n):[...stars,n];localStorage.setItem('radar-stars',JSON.stringify(stars));render()});if($('#search'))$('#search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};if($('#favorites'))$('#favorites').onclick=()=>{favorite=!favorite;render()};if($('#schema'))$('#schema').onclick=()=>modal('JSON 数据格式','<pre>'+esc(JSON.stringify({items:[{id:'唯一ID',published_at:'2026-10-27T09:30:00+08:00',source:'来源名称',content:'原文正文'}],reports:[{date:'2026-10-27',generated_at:'2026-10-27T10:00:00+08:00',summary:'分析摘要',risk:'风险',stocks:[{name:'公司名称',direction:'bull',reason:'依据',risk:'风险',evidence_ids:['唯一ID']}]}]},null,2))+'</pre>')}
$('#day').value=today();$('#day').max=today();$('#day').onchange=render;$('#import').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>5e6)throw Error('文件超过 5 MB');let d=JSON.parse(await f.text());if(!Array.isArray(d.items)||!Array.isArray(d.reports))throw Error('需要 items 和 reports 两个数组');for(let x of d.items)if(!x.id||!x.content||!x.source||!x.published_at||!Number.isFinite(Date.parse(x.published_at)))throw Error('资讯缺少 ID、来源、正文或有效时间');for(let r of d.reports){if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!Number.isFinite(Date.parse(r.generated_at))||!Array.isArray(r.stocks))throw Error('报告日期、时间或股票池格式不正确');if(r.bull_probability!=null&&(!Number.isFinite(r.bull_probability)||r.bull_probability<0||r.bull_probability>100))throw Error('概率必须在 0 到 100 之间');for(let s of r.stocks)if(!s.name||/\d{6}/.test(s.name)||!['bull','bear'].includes(s.direction))throw Error('股票请使用名称，方向为 bull 或 bear')};let next={items:[...new Map([...data.items,...d.items.filter(x=>!blocked(x))].map(x=>[x.id,x])).values()],reports:[...new Map([...data.reports,...d.reports].map(x=>[x.date+'|'+x.generated_at,x])).values()]};localStorage.setItem('radar-v1',JSON.stringify(next));data=next;render();modal('导入完成','<p>资料已保存到当前浏览器。推广来源已过滤。</p>')}catch(err){modal('导入未完成','<p>'+esc(err.message)+'</p>')}e.target.value=''};
$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({items:items(),reports:reports()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='finance-radar-'+$('#day').value+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
function clock(){$('#clock').textContent=new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' 北京时间'}clock();setInterval(clock,1000);render();

<style>textarea{width:100%;min-height:130px;background:#101d2c;color:#dce5ef;border:1px solid #2b3c51;border-radius:8px;padding:12px;font:inherit}.form{display:grid;gap:14px}.form label{display:grid;gap:8px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.note{white-space:pre-wrap}.table-wrap{overflow:auto}.tag{background:#173d3c;padding:4px 8px;border-radius:4px;color:#8ce6ce}.positive{color:#f696a3}.negative{color:#70d4b6}</style>
<script>
let extraState;try{extraState=JSON.parse(localStorage.getItem('radar-extra'))}catch{};extraState={notes:[],positions:[],bookmarks:[],...(extraState||{})};
let minScore=0,sector='',sourceFilter='',onlySaved=false;
function saveExtra(){localStorage.setItem('radar-extra',JSON.stringify(extraState))}
function downloadJSON(obj,name){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

const originalItems=items;items=()=>originalItems().filter(x=>(!sourceFilter||x.source===sourceFilter)&&(!onlySaved||extraState.bookmarks.includes(String(x.id))));
function field(label,name,value='',type='text'){return '<label>'+label+'<input required name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(type==='number'?'min="0" step="any"':'maxlength="120"')+'></label>'}
function editor(kind,id){const arr=kind==='note'?extraState.notes:extraState.positions,x=arr.find(x=>x.id===id)||{};modal(kind==='note'?'研究笔记':'持仓记录', '<form id="editForm" class="form">'+(kind==='note'?field('标题','title',x.title)+field('公司 / 行业','subject',x.subject)+ '<label>研究内容、依据与下一步观察<textarea required maxlength="10000" name="body">'+esc(x.body)+'</textarea></label>':field('公司名称（不填代码）','name',x.name)+field('持仓数量','quantity',x.quantity,'number')+field('平均成本','cost',x.cost,'number')+field('手动参考价格','price',x.price,'number'))+'<button type="submit">保存到本机</button></form>');$('#editForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(kind==='position'){if(/\d{6}/.test(v.name))return modal('名称需修改','请使用公司名称');for(let k of ['quantity','cost','price']){v[k]=Number(v[k]);if(!Number.isFinite(v[k])||v[k]<0)return;} }v.id=x.id||crypto.randomUUID();v.updated_at=new Date().toISOString();v.date=x.date||$('#day').value;const updated=arr.filter(a=>a.id!==v.id).concat(v);const prev=extraState;extraState={...extraState,[kind==='note'?'notes':'positions']:updated};try{saveExtra();$('#modal').close();render()}catch{extraState=prev;modal('未保存','浏览器存储空间不足，请导出备份。')}}}
function removeRecord(kind,id){modal('确认删除','<p>删除这条本机记录？此操作不会修改导入的市场资料。</p><button id="deleteConfirm">确认删除</button>');$('#deleteConfirm').onclick=()=>{extraState[kind]=extraState[kind].filter(x=>x.id!==id);saveExtra();$('#modal').close();render()}}
const baseRender=render;
render=function(){baseRender();const names=['自选追踪','研究笔记','持仓记录','报告对比'];$('#nav').insertAdjacentHTML('beforeend',names.map(x=>'<button data-extra="'+x+'" class="'+(page===x?'active':'')+'">'+x+'</button>').join(''));document.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{page=b.dataset.extra;render()});

lStorage.removeItem(k):localStorage.setItem(k,prior[i]));throw error}data=nd;stars=ns;extraState=ne;render();modal('恢复完成','已合并备份，相同记录以备份内容更新。')}catch(err){modal('恢复失败',esc(err.message))}}}

<script>
let cloudStatus=null,cloudError='',syncBusy=false,cloudLastRead='';
const localDateTime=t=>t?new Date(t).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'尚无';
async function api(path,options={}){const r=await fetch('/api/radar/'+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let d;try{d=await r.json()}catch{throw Error('登录已过期，请刷新页面重新登录')}if(!r.ok)throw Error(d.error||'服务暂不可用');return d}
function mergeCloud(incoming){data={items:[...new Map([...data.items,...incoming.items].filter(x=>!blocked(x)).map(x=>[x.id,{...x,source:x.room||x.room_name||x.source}])).values()],reports:[...new Map([...data.reports,...incoming.reports].map(x=>[x.date+'|'+x.generated_at,x])).values()]};try{localStorage.setItem('radar-v1',JSON.stringify(data))}catch{/* Cloud is durable; browser cache is optional. */}}
async function refreshCloud(){if(syncBusy)return;syncBusy=true;try{const day=$('#day').value;let cursor='',incoming={items:[],reports:[]};do{const d=await api('data?day='+encodeURIComponent(day)+'&cursor='+encodeURIComponent(cursor));incoming.items.push(...d.items);incoming.reports.push(...d.reports);cursor=d.next_cursor||''}while(cursor);mergeCloud(incoming);cloudStatus=await api('status');cloudLastRead=new Date().toISOString();cloudError=''}catch(e){cloudError=e.message}finally{syncBusy=false;render()}}
async function uploadCloud(d){let accepted=0;for(let i=0;i<d.items.length||i===0;i+=100){const chunk={items:d.items.slice(i,i+100),reports:[],client:'import'};accepted+=(await api('ingest',{method:'POST',body:JSON.stringify(chunk)})).accepted_ids.length}for(let i=0;i<(d.reports||[]).length;i+=10)await api('ingest',{method:'POST',body:JSON.stringify({items:[],reports:d.reports.slice(i,i+10),client:'import'})});return accepted}
const cloudBaseRender=render;
render=function(){cloudBaseRender();const c=cloudStatus?.state?.collector;const fresh=c&&Date.now()-Date.parse(c.at)<180000;const scan=cloudStatus?.state?.collector_scan;const scanFresh=!!scan&&Date.now()-Date.parse(scan.updated_at)<180000;const aiReady=!!cloudStatus?.ai_configured;const ai=cloudStatus?.state?.ai_pipeline;const aiText=aiReady?'AI 报告已同步（最近 '+localDateTime(cloudStatus.latest_ai_report)+'）':'尚未收到 AI 分析报告';const aiStateText=ai?(ai.status+'：'+ai.message+'（'+localDateTime(ai.last_run_at)+'）'):'尚未收到本机 AI 运行状态';const scanPhase=scan?.stage==='round_complete'?'本轮已完成':scan?.stage==='scanning'?'扫描中':(scan?.stage||'');const scanText=scan?((scanFresh?'状态新鲜':'状态已过期')+' · '+scanPhase+' · '+(scan.rooms_done||0)+'/'+(scan.rooms_total||0)+' 房间 · 待回补 '+(scan.backlog||0)+' · 重名 '+(scan.rooms_duplicate||0)+' · 定位失败 '+(scan.rooms_unmapped||0)+' · '+localDateTime(scan.updated_at)):'尚未收到本机扫描进度';
$('.notice').textContent=cloudError?'云端暂未连接：'+cloudError+'。保留本机已读资料。':cloudLastRead?'云端数据已连接 · 最近读取 '+localDateTime(cloudLastRead)+' · '+(fresh?'采集器最近 3 分钟内在线':'尚未收到近期采集器同步')+' · '+aiText+' · 房间扫描：'+scanText+' · AI运行：'+aiStateText+' · 图片 OCR：'+(ai?.ocr_available?'本机 Tesseract 已检测':'未检测到本机 Tesseract'):'正在读取私有云端数据…';
$('footer').textContent='财经雷达 · 0.3 数据接入版 ｜ 资讯与报告云端保存；自选、笔记、持仓和收藏仍保存在当前浏览器。';
if(page==='资讯研究'){document.querySelectorAll('#view article').forEach((el,i)=>{const visible=items().filter(x=>[x.content,x.source,x.author].join(' ').includes(query)).sort((a,b)=>String(b.published_at).localeCompare(String(a.published_at)));const x=visible[i];if(!x)return;const stamp=el.querySelector('.row small');if(stamp)stamp.textContent=localDateTime(x.published_at);if(x.time_rule==='hm_today_or_yesterday'||x.parse_status==='ocr_pending'){const info=document.createElement('small');info.textContent=(x.time_rule==='hm_today_or_yesterday'?'日期由时分推算，待核实。 ':'')+(x.parse_status==='ocr_pending'?'含图片，图片文字尚未识别。':'');info.className='amber';el.append(info)}})}
if(page==='采集与设置'){
const card=$('#view .card');card.innerHTML='<h2>数据链路</h2><table><tr><td>私有云端数据库</td><td>'+ (cloudLastRead?'已连接':'连接中')+'</td></tr><tr><td>采集器状态</td><td>'+ (fresh?'在线':'待连接 / 已离线')+'</td></tr><tr><td>房间扫描进度</td><td class="'+(scanFresh&&scan?.status==='collecting'?'green':'amber')+'">'+(scan?esc(scanText)+(scan.last_error?' · '+esc(scan.last_error):''):'尚未收到本机扫描进度')+'</td></tr><tr><td>最近采集同步</td><td>'+esc(localDateTime(c?.at))+'</td></tr><tr><td>最近文件导入</td><td>'+esc(localDateTime(cloudStatus?.state?.last_import?.at))+'</td></tr><tr><td>AI 引擎状态</td><td class="'+(ai?.status==='ready'?'green':'amber')+'">'+(ai?esc(ai.status+' · '+ai.message)+' · '+esc(localDateTime(ai.last_run_at)):'尚未收到本机状态')+'</td></tr><tr><td>本地模型算力</td><td class="'+(ai?.ollama_gpu_status==='gpu'?'green':'amber')+'">'+(ai?(ai.ollama_gpu_status==='gpu'?'Ollama GPU 推理 · 显存 '+Math.round((ai.ollama_vram_bytes||0)/1048576)+' MB':ai.ollama_gpu_status==='cpu'?'Ollama 当前 CPU 推理':ai.ollama_gpu_status==='not_loaded'?'千问模型当前未加载':'暂时无法读取 GPU 状态'):'尚未收到本机状态')+'</td></tr><tr><td>AI 分析报告</td><td class="'+(cloudStatus?.ai_configured?'green':'amber')+'">'+(cloudStatus?.ai_configured?'已收到 · '+esc(localDateTime(cloudStatus.latest_ai_report)):'尚未收到报告')+'</td></tr><tr><td>图片 OCR</td><td class="'+(ai?.ocr_available?'green':'amber')+'">'+(ai?(ai.ocr_available?'本机 Tesseract 已检测，中文 OCR 在本机运行':'未检测到 Tesseract，图片原文仍保留待识别'):'尚未收到本机 OCR 状态')+'</td></tr></table>';
$('#view').insertAdjacentHTML('afterbegin','<section class="card"><h2>连接电脑采集器</h2><p>首次启用自动升级：下载 update.bat，保存到原有项目的 collector 文件夹。以后升级只需双击 update.bat；程序会自动备份本机资料、下载最新代码、更新依赖并运行测试。升级前请先停止采集器并关闭它打开的 MX 浏览器。</p><div class="tools"><a href="https://raw.githubusercontent.com/ceel28575/finance-radar/main/collector/update.bat" download="update.bat">下载一键更新器</a><a href="/api/radar/collector-config" download="cloud-config.json">下载同步配置</a><button id="checkCloud">检查同步状态</button></div><small>update.bat 只需首次保存到原 collector 文件夹。MX 登录档案、历史数据库和同步配置会保留；豆包 API Key 不写入磁盘，启动时可能需要重新输入。连接后每 60 秒尝试同步新增及变更资讯，失败保留本机并重试。网页打开时每 60 秒读取一次云端数据；完整扫描所有房间可能更久。</small></section><section class="card"><h2>云端日期档案</h2>'+((cloudStatus?.days||[]).map(x=>'<button data-cloud-day="'+esc(x.day)+'">'+esc(x.day)+' · '+x.count+' 条</button>').join(' ')||'<p>尚无云端记录</p>')+'</section>');
$('#checkCloud').onclick=refreshCloud;document.querySelectorAll('[data-cloud-day]').forEach(b=>b.onclick=()=>{$('#day').value=b.dataset.cloudDay;page='资讯研究';refreshCloud()});
const paragraphs=[...document.querySelectorAll('#view p')];for(const p of paragraphs)if(p.textContent.includes('支持资讯与分析报告 JSON'))p.textContent='支持资讯与报告 JSON。导入后写入私有云端；相同 ID 合并，按北京时间归档。单文件上限 5 MB。';
}}
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#import').disabled=true;try{if(f.size>5e6)throw Error('文件超过 5 MB');const d=JSON.parse(await f.text());if(!Array.isArray(d.items)||!Array.isArray(d.reports))throw Error('需要 items 和 reports 数组');const n=await uploadCloud(d);if(d.items.length)$('#day').value=dayOf(d.items[d.items.length-1].published_at);await refreshCloud();modal('云端导入完成','<p>已接收 '+n+' 条资讯（重复 ID 更新，不重复累计）。</p>')}catch(err){modal('导入未完成',esc(err.message)+'。已完成批次保留，可重新导入。')}finally{e.target.value='';$('#import').disabled=false}};
$('#day').onchange=()=>{render();refreshCloud()};
data.items=data.items.map(x=>({...x,source:x.room||x.room_name||x.source}));
refreshCloud();setInterval(refreshCloud,60000);
</script>
