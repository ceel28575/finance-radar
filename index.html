<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>财经雷达 · 研究工作台</title><style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#080f19;color:#dce5ef}*{box-sizing:border-box}body{margin:0}aside{position:fixed;width:210px;height:100vh;background:#0c1421;border-right:1px solid #253144;padding:28px 18px}h1{font-size:28px;letter-spacing:1px}h2{font-size:18px}h3{font-size:15px}small,.muted{color:#8292aa;line-height:1.8}button,input,select{font:inherit;color:inherit;border:1px solid #2b3c51;background:#101d2c;border-radius:8px;padding:10px 13px}button{cursor:pointer}button:hover,button.active{background:#173d3c;border-color:#4bb9a4;color:#8ce6ce}nav button{display:block;width:100%;text-align:left;margin:10px 0;border:0}main{margin-left:210px;padding:34px 38px;max-width:1650px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:3px;color:#72d9bf}.badge{display:inline-block;font-size:11px;padding:5px 9px;border-radius:5px;background:#243145;color:#a9bad0}.amber{color:#e7bc75}.red{color:#f696a3}.green{color:#70d4b6}.grid{display:grid;gap:18px;grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(130deg,#111e2e,#0c1623);border:1px solid #253247;border-radius:14px;padding:22px;margin-top:18px}.metric{font-size:30px;font-weight:600;margin:16px 0}.notice{border-left:3px solid #cca366;background:#201f24;padding:14px 18px;margin:24px 0;font-size:13px;color:#d4bd9c}.empty{padding:45px 16px;text-align:center;color:#7f90a8;line-height:2}.stock{border-top:1px solid #253247;padding:20px 0}.stock p,p{line-height:1.85;font-size:14px}.bar{height:8px;border-radius:5px;background:#263648;overflow:hidden}.bar i{height:100%;display:block;background:#d9818d}.tabs{display:flex;gap:10px;margin:24px 0;flex-wrap:wrap}details{margin:12px 0;font-size:13px;color:#99abc2}summary{cursor:pointer}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:15px 8px;border-bottom:1px solid #253247}a{color:#81d7c0}footer{font-size:11px;color:#6b819b;margin:30px 0}dialog{max-width:700px;width:90%;background:#121f30;color:#dce5ef;border:1px solid #3c5570;border-radius:14px;padding:28px}dialog::backdrop{background:#000a}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}input[type=search]{min-width:260px}label{font-size:12px;color:#9dadc3}.hidden{display:none}@media(max-width:950px){aside{position:static;width:100%;height:auto;padding:16px}aside nav{display:flex;overflow:auto}nav button{min-width:100px}aside small{display:none}main{margin:0;padding:20px}.grid,.four{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid,.two,.four{grid-template-columns:1fr}main{padding:16px}h1{font-size:23px}}
</style><aside><div class="eyebrow">◉ FINANCE RADAR</div><h2>财经雷达</h2><small>资讯 → 证据 → 研判</small><nav id="nav"></nav><small>北京时间 · 按日归档<br>盘中 3 分钟 / 盘后 30 分钟<br>午休暂停</small></aside><main><header><div><div class="eyebrow">RESEARCH WORKSPACE / 研究工作台</div><h1 id="title">市场总览</h1><small id="clock"></small></div><div class="row"><label>分析日期 <input type="date" id="day"></label><button id="import">导入数据</button><button id="export">导出当日</button></div></header><div class="notice">数据接入待完成 · 当前展示你导入的本机数据。实时 MX 采集与 AI 服务尚未连接，不会生成虚构行情或概率。</div><div id="view"></div><footer>财经雷达 · GitHub 版本 0.1　｜　AI 概率为模型判断，不代表实际胜率　｜　资料仅保存在当前浏览器，请定期导出备份。</footer></main><input type="file" id="file" accept=".json,application/json" hidden><dialog id="modal"><div class="row"><h2 id="modalTitle">详情</h2><button onclick="document.querySelector('dialog').close()">关闭</button></div><div id="modalBody"></div></dialog><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let data={items:[],reports:[]};try{data=JSON.parse(localStorage.getItem('radar-v1'))||data}catch{};let page='市场总览',query='',direction='全部',favorite=false;let stars;try{stars=JSON.parse(localStorage.getItem('radar-stars'))||[]}catch{stars=[]}
const blocked=x=>/奇幻团课|qmxp2077/i.test([x.source,x.author,x.room,x.content].join(' '));
const dayOf=t=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t))}catch{return ''}};
const items=()=>data.items.filter(x=>dayOf(x.published_at)===$('#day').value&&!blocked(x));
const reports=()=>data.reports.filter(x=>x.date===$('#day').value).sort((a,b)=>String(b.generated_at).localeCompare(String(a.generated_at)));
const report=()=>reports()[0];
const stocks=()=>((report()?.stocks)||[]).filter(x=>(!favorite||stars.includes(x.name))&&(!query||[x.name,x.reason,x.sector].join(' ').includes(query)));
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()}
function empty(t){return '<div class="empty">◌<br>'+t+'</div>'}
function card(t,v,n){return '<div class="card"><small>'+t+'</small><div class="metric">'+v+'</div><small>'+n+'</small></div>'}
function stockList(side){return '<div class="card"><div class="row"><h2 class="'+(side==='bull'?'red':'green')+'">'+(side==='bull'?'↗ 看多股票':'↘ 看空股票')+'</h2><span class="badge">按分析评分排序</span></div>'+ (stocks().filter(x=>x.direction===side).sort((a,b)=>(b.score||0)-(a.score||0)).map((x,i)=>'<article class="stock"><div class="row"><h3>'+String(i+1).padStart(2,'0')+'　'+esc(x.name)+'</h3><button data-star="'+esc(x.name)+'">'+(stars.includes(x.name)?'★':'☆')+'</button></div><small>'+esc(x.sector||'未标注行业')+' · '+(x.score??'—')+' / 100 分析评分</small><p>'+esc(x.reason)+'</p><details><summary>证据、催化与风险</summary><p>催化：'+esc(x.catalyst||'待补充')+'</p><p>风险：'+esc(x.risk||'待补充')+'</p><p>观点失效条件：'+esc(x.invalidation||'待补充')+'</p><p>较前次变化：'+esc(x.change||'无变化记录')+'</p><p>依据：'+esc((x.evidence_ids||[]).join('、')||'尚无关联来源')+'</p></details></article>').join('')||empty('当日暂无有依据的'+(side==='bull'?'看多':'看空')+'标的'))+'</div>'}
function render(){ $('#title').textContent=page;$('#nav').innerHTML=['市场总览','每日股票池','资讯研究','历史报告','采集与设置'].map((x,i)=>'<button data-page="'+x+'" class="'+(page===x?'active':'')+'">0'+(i+1)+'　'+x+'</button>').join('');let r=report(),it=items(),html='';
if(page==='市场总览'){html='<div class="grid four">'+card('当日有效资讯',it.length,'按原文北京时间归档')+card('已保存研判',reports().length,'保留每轮分析结果')+card('看多 / 看空',(r?.stocks||[]).filter(x=>x.direction==='bull').length+' / '+(r?.stocks||[]).filter(x=>x.direction==='bear').length,'当日股票池')+card('有效来源',new Set(it.map(x=>x.source)).size,'去重后的来源数')+'</div><div class="grid"><section class="card"><div class="row"><h2>指数方向</h2><span class="badge">AI 研判</span></div>'+(r?.bull_probability!=null?'<div class="metric red">'+esc(r.bull_probability)+'% <small>看多</small></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,r.bull_probability))+'%"></i></div><p class="green">看空 '+(100-r.bull_probability)+'%</p><p>'+esc(r.index_reason)+'</p>':empty('待接入有效数据<br>暂不估计多空概率'))+'</section><section class="card"><h2>盘面主线</h2><p>'+esc(r?.summary||'暂无当日盘面分析。导入已有报告后，将显示资金方向、主导板块与市场分歧。')+'</p><small>报告时间：'+esc(r?.generated_at||'—')+'</small></section><section class="card"><h2>风险与观察</h2><p>'+esc(r?.risk||'暂无有依据的风险研判')+'</p><small>关注证据变化与观点失效条件，避免仅根据单条消息形成判断。</small></section></div><div class="grid two">'+stockList('bull')+stockList('bear')+'</div>'}
if(page==='每日股票池'){html='<div class="tabs"><input id="search" type="search" placeholder="搜索公司、行业或理由" value="'+esc(query)+'"><button id="favorites" class="'+(favorite?'active':'')+'">★ 仅看自选</button></div><small>股票池按分析日期保存。收藏保存在当前浏览器，刷新不丢失。</small><div class="grid two">'+stockList('bull')+stockList('bear')+'</div>'}
if(page==='资讯研究'){html='<div class="tabs"><input id="search" type="search" placeholder="搜索正文、作者、来源" value="'+esc(query)+'"></div><div class="card"><h2>当日资讯档案</h2>'+ (it.filter(x=>[x.content,x.source,x.author].join(' ').includes(query)).sort((a,b)=>String(b.published_at).localeCompare(String(a.published_at))).map(x=>'<article class="stock"><div class="row"><span class="badge">'+esc(x.source)+'</span><small>'+esc(x.published_at)+'</small></div><h3>'+esc(x.title||'资讯正文')+'</h3><p>'+esc(x.content)+'</p><small>作者 '+esc(x.author||'未标注')+' · ID '+esc(x.id)+' · '+esc(x.kind||'来源内容，尚未独立核实')+'</small></article>').join('')||empty('暂无匹配资讯'))+'</div>'}
if(page==='历史报告'){html='<div class="card"><h2>当日研判时间线</h2><small>切换右上角日期查看历史。导入时保留不同时间的报告。</small>'+(reports().map(r=>'<details class="stock"><summary>'+esc(r.generated_at)+'　'+esc(r.title||'市场研判')+'</summary><p>'+esc(r.summary)+'</p><p>风险：'+esc(r.risk)+'</p><p>股票池 '+(r.stocks||[]).length+' 只</p></details>').join('')||empty('该日暂无报告'))+'</div>'}
if(page==='采集与设置'){html='<div class="grid two"><div class="card"><h2>数据链路</h2><table><tr><td>MX 网页采集</td><td class="amber">未连接</td></tr><tr><td>图片 OCR</td><td class="amber">待接入</td></tr><tr><td>GPT 分析服务</td><td class="amber">未配置</td></tr><tr><td>云端持久化</td><td class="amber">尚未启用</td></tr><tr><td>JSON 导入 / 导出</td><td class="green">可用 · 本机保存</td></tr></table></div><div class="card"><h2>整理规则</h2><p>盘中每 3 分钟，盘后每 30 分钟；午休跳过。</p><p>按北京时间原文日期归档，跨日新建股票池。</p><p>屏蔽：奇幻团课 / 微信 qmxp2077。</p><small>以上为目标调度规则，当前网页不会在后台自动采集或调用 AI。</small></div></div><div class="card"><h2>导入已有资料</h2><p>支持资讯与分析报告 JSON。相同 ID 的资讯合并；同日期、同生成时间的报告更新。单文件上限 5 MB。</p><button id="schema">查看导入格式</button><p><a href="https://github.com/ceel28575/finance-radar" target="_blank" rel="noopener">查看 GitHub 源码 ↗</a></p></div>'}
$('#view').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;query='';render()});document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{let n=b.dataset.star;stars=stars.includes(n)?stars.filter(x=>x!==n):[...stars,n];localStorage.setItem('radar-stars',JSON.stringify(stars));render()});if($('#search'))$('#search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};if($('#favorites'))$('#favorites').onclick=()=>{favorite=!favorite;render()};if($('#schema'))$('#schema').onclick=()=>modal('JSON 数据格式','<pre>'+esc(JSON.stringify({items:[{id:'唯一ID',published_at:'2026-10-27T09:30:00+08:00',source:'来源名称',content:'原文正文'}],reports:[{date:'2026-10-27',generated_at:'2026-10-27T10:00:00+08:00',summary:'分析摘要',risk:'风险',stocks:[{name:'公司名称',direction:'bull',reason:'依据',risk:'风险',evidence_ids:['唯一ID']}]}]},null,2))+'</pre>')}
$('#day').value=today();$('#day').max=today();$('#day').onchange=render;$('#import').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>5e6)throw Error('文件超过 5 MB');let d=JSON.parse(await f.text());if(!Array.isArray(d.items)||!Array.isArray(d.reports))throw Error('需要 items 和 reports 两个数组');for(let x of d.items)if(!x.id||!x.content||!x.source||!x.published_at||!Number.isFinite(Date.parse(x.published_at)))throw Error('资讯缺少 ID、来源、正文或有效时间');for(let r of d.reports){if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!Number.isFinite(Date.parse(r.generated_at))||!Array.isArray(r.stocks))throw Error('报告日期、时间或股票池格式不正确');if(r.bull_probability!=null&&(!Number.isFinite(r.bull_probability)||r.bull_probability<0||r.bull_probability>100))throw Error('概率必须在 0 到 100 之间');for(let s of r.stocks)if(!s.name||/\d{6}/.test(s.name)||!['bull','bear'].includes(s.direction))throw Error('股票请使用名称，方向为 bull 或 bear')};let next={items:[...new Map([...data.items,...d.items.filter(x=>!blocked(x))].map(x=>[x.id,x])).values()],reports:[...new Map([...data.reports,...d.reports].map(x=>[x.date+'|'+x.generated_at,x])).values()]};localStorage.setItem('radar-v1',JSON.stringify(next));data=next;render();modal('导入完成','<p>资料已保存到当前浏览器。推广来源已过滤。</p>')}catch(err){modal('导入未完成','<p>'+esc(err.message)+'</p>')}e.target.value=''};
$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({items:items(),reports:reports()},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='finance-radar-'+$('#day').value+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
function clock(){$('#clock').textContent=new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' 北京时间'}clock();setInterval(clock,1000);render();
</script></html>
