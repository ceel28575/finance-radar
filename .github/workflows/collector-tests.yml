name: Collector tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt
      - name: Compile all collector modules
        run: python -m compileall -q collector
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run validation tests
        run: node --test tests/validation.test.mjs
      - name: Parse active dashboard JavaScript
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; const html=readFileSync('dashboard.html','utf8'); const scripts=[...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]; if(!scripts.length) throw new Error('No inline scripts found'); scripts.forEach((m,i)=>new Function(m[1])); console.log('Parsed '+scripts.length+' dashboard script block(s)');"

  site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install site dependencies
        run: pnpm install --frozen-lockfile
      - name: Build private website and API routes
        run: pnpm build

  windows-updater-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows updater
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'collector/update.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
          Write-Host 'PowerShell updater syntax OK'
